<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Im Umbau</title>
    <style>
        :root {
            --bg-color: #f2f2f0;
            --text-color: #87a846;
            --divider-color: #607536;
            --track-color: rgba(0, 128, 32, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 0; 
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes loadProgress {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1, .content-text {
            opacity: 0;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }

        h1 {
            grid-column: 2 / -1;
            grid-row: 3 / -1;
            font-size: 16vh;
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.04em;
            pointer-events: none;
            
            animation-name: slideInLeft;
            animation-duration: 1.2s;
            animation-delay: 0.2s;
        }

        .divider {
            grid-column: 2 / 6;
            grid-row: 4 / 5;
            width: 50dvw;
            height: 4px;
            background-color: var(--track-color);
            
            justify-self: center;
            align-self: start;
            margin-top: 10vh;
            z-index: 2;
            position: relative;
            
            opacity: 0; 
            animation: fadeIn 0.8s ease-out forwards;
            animation-delay: 0.5s;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: var(--divider-color);
            
            transform-origin: left;
            transform: scaleX(0);
            
            animation-name: loadProgress;
            animation-duration: 2.0s;
            animation-delay: 0.8s;
            animation-fill-mode: forwards;
            
            animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }

        .content-text {
            grid-column: 2 / 5;
            grid-row: 6 / 8;
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            line-height: 1.3;
            font-weight: 500;

            animation-name: slideInLeft;
            animation-duration: 1.5s;

            animation-delay: 2.6s; 
        }

        @media (max-width: 768px) {
            h1 { font-size: 6vh; }
            .content-text { grid-column: 2 / 7; grid-row: 5 / 6; }
            .divider { margin-top: 5vh; width: 80dvw; }
        }
    </style>
</head>
<body>

    <h1>in Bearbeitung..</h1>

    <div class="divider"></div>

    <div class="content-text">
        <p>
            Wir machen uns frisch für die Region! Hier wächst gerade unsere neue Webseite heran - 
            natürlich mit viel Liebe zum Detail.<br />Danke für deine Treue und bis ganz bald.
        </p>
    </div>

</body>
</html>
